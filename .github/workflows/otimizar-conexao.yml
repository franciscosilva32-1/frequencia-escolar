name: Otimizar conexão Supabase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/otimizar-conexao.yml'
      - 'TRIGGER_PERFORMANCE.txt'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar otimização
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('APP.py')
          s = p.read_text(encoding='utf-8')

          old = '''    try:
        return pool.ThreadedConnectionPool(1, 10, url, connect_timeout=10)
    except Exception as e:'''
          new = '''    try:
        return pool.ThreadedConnectionPool(0, 10, url, connect_timeout=10)
    except Exception as e:'''
          if old not in s:
              raise SystemExit('Pool não encontrado')
          s = s.replace(old, new, 1)

          start = s.index('def conectar_bd():')
          end = s.index('\ndef liberar_conn', start)
          novo = '''def conectar_bd():
    pool_obj = get_connection_pool()
    if not pool_obj:
        st.error("🚨 ERRO: Pool de conexões não foi criado.")
        st.stop()

    for tentativa in range(1, 3):
        conn = None
        try:
            conn = pool_obj.getconn()
            return conn
        except Exception as e:
            if conn:
                try:
                    pool_obj.putconn(conn, close=True)
                except Exception:
                    pass
            if tentativa == 2:
                st.error(f"🚨 FALHA NA CONEXÃO APÓS 2 TENTATIVAS. ERRO EXATO: {e}")
                st.stop()
            time.sleep(0.5)
    return None
'''
          s = s[:start] + novo + s[end+1:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar sintaxe
        run: python -m py_compile APP.py
      - name: Publicar e remover workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP.py
          git commit -m "Acelera conexão com Supabase" || true
          git rm .github/workflows/otimizar-conexao.yml TRIGGER_PERFORMANCE.txt
          git commit -m "Remove artefatos temporários de otimização" || true
          git push
