name: Melhoria visual segura

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/estetica-segura.yml'

permissions:
  contents: write

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar somente CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('APP.py')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = r'''

    /* ================= MELHORIA VISUAL — SEM IMPACTO FUNCIONAL ================= */
    .stButton > button,
    [data-testid="stFormSubmitButton"] > button {
        min-height: 48px !important;
        border-radius: 12px !important;
        border: 2px solid #cbd5e1 !important;
        font-weight: 900 !important;
        letter-spacing: .2px !important;
        transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease !important;
    }
    .stButton > button:hover,
    [data-testid="stFormSubmitButton"] > button:hover {
        transform: translateY(-1px) !important;
        border-color: #ff7b00 !important;
        box-shadow: 0 6px 16px rgba(10,31,53,.14) !important;
    }
    .stButton > button:active,
    [data-testid="stFormSubmitButton"] > button:active {
        transform: translateY(0) scale(.985) !important;
        box-shadow: 0 2px 8px rgba(10,31,53,.10) !important;
    }

    [data-testid="stRadio"] div[role="radiogroup"] {
        gap: 8px !important;
    }
    [data-testid="stRadio"] div[role="radiogroup"] > label {
        border: 2px solid #d8e0e8 !important;
        border-radius: 14px !important;
        padding: 12px 16px !important;
        box-shadow: 0 2px 8px rgba(15,23,42,.05) !important;
        background: linear-gradient(180deg,#ffffff 0%,#f8fafc 100%) !important;
        transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease !important;
    }
    [data-testid="stRadio"] div[role="radiogroup"] > label:hover {
        transform: translateY(-1px) !important;
        border-color: #ff7b00 !important;
        box-shadow: 0 5px 14px rgba(15,23,42,.08) !important;
    }

    [data-baseweb="select"] > div {
        border-radius: 12px !important;
        box-shadow: 0 2px 8px rgba(15,23,42,.04) !important;
    }
    [data-baseweb="select"] > div:hover {
        border-color: #ff7b00 !important;
    }

    div[data-testid="stExpander"] {
        border-radius: 14px !important;
        border: 1px solid #dbe3ec !important;
        box-shadow: 0 2px 8px rgba(15,23,42,.04) !important;
        overflow: hidden !important;
    }
    div[data-testid="stExpander"] summary {
        padding: 10px 14px !important;
    }

    [data-testid="stDataFrame"] {
        border-radius: 12px !important;
        overflow: hidden !important;
        border: 1px solid #dbe3ec !important;
    }

    hr {
        margin: 1rem 0 !important;
    }

    @media (max-width: 900px) {
        [data-testid="stRadio"] div[role="radiogroup"] > label {
            padding: 10px 12px !important;
        }
        .stButton > button,
        [data-testid="stFormSubmitButton"] > button {
            min-height: 46px !important;
        }
    }
    /* ================= FIM DA MELHORIA VISUAL ================= */
'''
          if s.count(marker) != 1:
              raise SystemExit('Bloco CSS não identificado de forma segura; nenhuma alteração aplicada.')
          if 'MELHORIA VISUAL — SEM IMPACTO FUNCIONAL' in s:
              raise SystemExit('Melhoria visual já aplicada; abortando para evitar duplicação.')
          s = s.replace(marker, css + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar sintaxe
        run: python -m py_compile APP.py

      - name: Publicar e limpar workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP.py
          git commit -m "Melhora estética de botões e abas" || true
          git rm .github/workflows/estetica-segura.yml
          git commit -m "Remove workflow temporário de estética" || true
          git push
