name: Otimização segura de startup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/otimizacao-startup-segura.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar otimização de inicialização
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('APP.py')
          s = p.read_text(encoding='utf-8')

          # A inicialização do schema não deve bloquear a tela de login.
          old = 'inicializar_tabelas()\n\n# ------------------------------------------------------------\n# 5. CSS'
          new = '# inicializar_tabelas() será executada somente após autenticação.\n\n# ------------------------------------------------------------\n# 5. CSS'
          if old not in s:
              raise SystemExit('Marcador da inicialização do banco não encontrado; abortando sem alterações.')
          s = s.replace(old, new, 1)

          # Insere a inicialização logo após a autenticação do usuário e antes do carregamento dos alunos.
          old = "try:\n    user = json.loads(base64.b64decode(auth_cookie).decode())\n    eh_admin = user.get('admin', user.get('eh_admin', False)) \nexcept Exception: \n    cookies[\"auth_token\"] = \"\"\n    cookies.save()\n    st.rerun()\n\ndf_alunos = carregar_alunos()"
          new = "try:\n    user = json.loads(base64.b64decode(auth_cookie).decode())\n    eh_admin = user.get('admin', user.get('eh_admin', False)) \nexcept Exception: \n    cookies[\"auth_token\"] = \"\"\n    cookies.save()\n    st.rerun()\n\n# Inicializa/valida o schema apenas para usuários autenticados.\ninicializar_tabelas()\n\ndf_alunos = carregar_alunos()"
          if old not in s:
              raise SystemExit('Bloco de autenticação não encontrado; abortando sem alterações.')
          s = s.replace(old, new, 1)

          # Adiciona consulta combinada para os indicadores básicos.
          marcador = 'def carregar_alunos():\n'
          pos = s.index(marcador)
          fim_func = s.index('@st.cache_data(ttl=60)\ndef carregar_faltas', pos)
          bloco = s[pos:fim_func]
          if 'def carregar_resumo_dashboard' not in bloco:
              bloco_novo = bloco + '''@st.cache_data(ttl=60)\ndef carregar_resumo_dashboard(data_str, turma="Todas"):\n    """Retorna total de alunos ativos e presenças da data em uma única consulta."""\n    conn = None\n    try:\n        conn = conectar_bd()\n        if not conn:\n            return 0, 0\n        cur = conn.cursor()\n        if turma == "Todas":\n            cur.execute("""\n                SELECT\n                    COUNT(DISTINCT a.codigo) AS total_alunos,\n                    COUNT(DISTINCT CASE WHEN r.tipo_registro='PRESENCA' THEN r.codigo_aluno END) AS presentes\n                FROM alunos_v2 a\n                LEFT JOIN registros_v2 r\n                  ON r.codigo_aluno = a.codigo AND r.data = %s\n                WHERE a.status = 'ATIVO'\n            """, (data_str,))\n        else:\n            cur.execute("""\n                SELECT\n                    COUNT(DISTINCT a.codigo) AS total_alunos,\n                    COUNT(DISTINCT CASE WHEN r.tipo_registro='PRESENCA' THEN r.codigo_aluno END) AS presentes\n                FROM alunos_v2 a\n                LEFT JOIN registros_v2 r\n                  ON r.codigo_aluno = a.codigo AND r.data = %s\n                WHERE a.status = 'ATIVO' AND a.turma = %s\n            """, (data_str, turma))\n        row = cur.fetchone() or (0, 0)\n        return int(row[0] or 0), int(row[1] or 0)\n    except Exception:\n        return 0, 0\n    finally:\n        liberar_conn(conn)\n\n'''
              s = s[:pos] + bloco_novo + s[fim_func:]

          # Substitui o cálculo redundante dos indicadores globais por uma única consulta.
          old = '''if tf == "Todas":\n    df_alunos_filtrado = df_alunos \nelse:\n    df_alunos_filtrado = df_alunos[df_alunos['turma'] == tf]\ntotal_alunos = len(df_alunos_filtrado)\npres_data = contar_presencas_data(data_selecionada_str, tf)\nif total_alunos > 0:\n    media_geral_freq = f"{(pres_data / total_alunos) * 100:.1f}%" \nelse:\n    media_geral_freq = "0%"'''
          new = '''total_alunos, pres_data = carregar_resumo_dashboard(data_selecionada_str, tf)\nif total_alunos > 0:\n    media_geral_freq = f"{(pres_data / total_alunos) * 100:.1f}%"\nelse:\n    media_geral_freq = "0%"'''
          if old not in s:
              raise SystemExit('Bloco de indicadores globais não encontrado; abortando sem alterações.')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('Otimização de startup aplicada.')
          PY

      - name: Validar sintaxe
        run: python -m py_compile APP.py

      - name: Publicar e remover workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP.py
          git commit -m "Otimiza startup e consolida indicadores" || true
          git rm .github/workflows/otimizacao-startup-segura.yml
          git commit -m "Remove workflow temporário de otimização" || true
          git push
