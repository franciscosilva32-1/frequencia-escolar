name: Aplicar menu lateral

# Dispara a aplicação da melhoria no APP.py após qualquer push na main.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  aplicar:
    if: "!contains(github.event.head_commit.message, 'menu lateral - aplicado')"
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Reorganizar navegação e painel
        shell: python
        run: |
          from pathlib import Path

          path = Path('APP.py')
          text = path.read_text(encoding='utf-8')

          old_config = 'st.set_page_config(page_title="Centro Educa Mais Jansen Veloso", page_icon="🏫", layout="wide", initial_sidebar_state="collapsed")'
          new_config = 'st.set_page_config(page_title="Centro Educa Mais Jansen Veloso", page_icon="🏫", layout="wide", initial_sidebar_state="expanded")'
          if old_config not in text:
              raise SystemExit('Configuração de sidebar não encontrada.')
          text = text.replace(old_config, new_config, 1)

          old_nav = '''abas_do_sistema = ["📝 Registro", "📊 Gestão Frequência", "🚨 Alertas", "📈 Histórico", "📑 Desempenho Acadêmico", "💬 Satisfação Pública"]
if eh_admin:
    abas_do_sistema.append("⚙️ Manutenção do Sistema")

aba_atual = st.radio(
    "Módulo do sistema",
    abas_do_sistema,
    horizontal=True,
    key="navegacao_principal",
    label_visibility="collapsed"
)'''

          new_nav = '''abas_do_sistema = [
    "🏠 Visão Geral",
    "📝 Registro",
    "📊 Gestão Frequência",
    "🚨 Alertas",
    "📈 Histórico",
    "📑 Desempenho Acadêmico",
    "💬 Satisfação Pública"
]
if eh_admin:
    abas_do_sistema.append("⚙️ Manutenção do Sistema")

st.sidebar.markdown('<div class="menu-header">☰ MENU</div>', unsafe_allow_html=True)
aba_atual = st.sidebar.radio(
    "Navegação principal",
    abas_do_sistema,
    index=0,
    key="navegacao_principal",
    label_visibility="collapsed"
)

if eh_admin:
    st.sidebar.markdown("---")
    st.sidebar.markdown('<div style="font-size:0.95rem;font-weight:900;color:#64748b;margin:0 0 8px 2px;">ADMINISTRAÇÃO</div>', unsafe_allow_html=True)
    try:
        st.sidebar.page_link("pages/06_Manutencao_AVS.py", label="📊 Painel de Avaliação")
    except Exception:
        pass'''

          if old_nav not in text:
              raise SystemExit('Bloco de navegação principal não encontrado.')
          text = text.replace(old_nav, new_nav, 1)

          old_index = 'indice_aba = 0'
          new_index = '# 0 = Visão Geral; os módulos existentes começam no índice 1.\nindice_aba = 1'
          if old_index not in text:
              raise SystemExit('Índice inicial de navegação não encontrado.')
          text = text.replace(old_index, new_index, 1)

          css_anchor = '    .top7-details { font-size: 1.8rem !important; color: #64748b; font-weight: 800; background: #e2e8f0; display: inline-block; padding: 0.5rem 1.5rem; border-radius: 30px;}\n'
          css_insert = '''
    /* MENU LATERAL */
    section[data-testid="stSidebar"] {
        background: linear-gradient(180deg, #f8fafc 0%, #eef4fa 100%) !important;
        border-right: 1px solid #dbe4ee !important;
    }
    section[data-testid="stSidebar"] .menu-header {
        background: linear-gradient(135deg, #0a1f35 0%, #1a4b82 100%);
        color: #ffffff;
        border-radius: 16px;
        padding: 14px 18px;
        margin: 8px 0 18px 0;
        text-align: center;
        font-size: 1.45rem !important;
        font-weight: 900;
        letter-spacing: 1px;
        box-shadow: 0 7px 18px rgba(10,31,53,.18);
    }
    section[data-testid="stSidebar"] [data-testid="stRadio"] > div { gap: 10px !important; }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label {
        display: flex !important;
        align-items: center !important;
        min-height: 54px !important;
        padding: 10px 14px !important;
        margin: 0 !important;
        border: 2px solid #d8e1eb !important;
        border-radius: 14px !important;
        background: #ffffff !important;
        box-shadow: 0 3px 10px rgba(15,23,42,.05) !important;
        color: #1e293b !important;
        font-size: 1.08rem !important;
        font-weight: 850 !important;
        transition: .18s ease !important;
    }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:hover {
        transform: translateX(3px);
        box-shadow: 0 6px 14px rgba(15,23,42,.10) !important;
    }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:nth-child(1) { border-left: 7px solid #0ea5e9 !important; }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:nth-child(2) { border-left: 7px solid #10b981 !important; }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:nth-child(3) { border-left: 7px solid #f97316 !important; }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:nth-child(4) { border-left: 7px solid #8b5cf6 !important; }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:nth-child(5) { border-left: 7px solid #3b82f6 !important; }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:nth-child(6) { border-left: 7px solid #ec4899 !important; }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:nth-child(7) { border-left: 7px solid #f59e0b !important; }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:nth-child(8) { border-left: 7px solid #14b8a6 !important; }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:has(input:checked) {
        background: linear-gradient(90deg, #0a1f35 0%, #173f6d 100%) !important;
        color: #ffffff !important;
        border-color: #0a1f35 !important;
        box-shadow: 0 8px 18px rgba(10,31,53,.20) !important;
    }
    section[data-testid="stSidebar"] div[role="radiogroup"] > label:has(input:checked) * {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
    }
    section[data-testid="stSidebarNav"] { display: none !important; }
'''
          if css_anchor not in text:
              raise SystemExit('Ponto de inserção do CSS não encontrado.')
          text = text.replace(css_anchor, css_anchor + css_insert, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verificar sintaxe
        run: python -m py_compile APP.py

      - name: Publicar e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP.py .github/workflows/aplicar_menu_lateral.yml
          git commit -m "Melhora menu lateral - aplicado"
          git push