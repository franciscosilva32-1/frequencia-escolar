name: Otimização segura de desempenho

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-lazy-safe.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar otimização segura
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('APP.py')
          s = p.read_text(encoding='utf-8')

          # 1) Navegação única, inserida antes das consultas acadêmicas pesadas.
          marker = 'with st.spinner("Sincronizando dados..."):\n    dff = obter_dados_acad_filtrados(ano_f, pf, af, tf)\n'
          nav = '''abas_do_sistema = ["📝 Registro", "📊 Gestão Frequência", "🚨 Alertas", "📈 Histórico", "📑 Desempenho Acadêmico", "💬 Satisfação Pública"]
          if eh_admin:
              abas_do_sistema.append("⚙️ Manutenção do Sistema")

          aba_atual = st.radio(
              "Módulo do sistema",
              abas_do_sistema,
              horizontal=True,
              key="navegacao_principal",
              label_visibility="collapsed"
          )

          dff = pd.DataFrame()
          if aba_atual == "📑 Desempenho Acadêmico":
              with st.spinner("Sincronizando dados acadêmicos..."):
                  dff = obter_dados_acad_filtrados(ano_f, pf, af, tf)
          '''
          if marker not in s:
              raise SystemExit('Bloco acadêmico original não encontrado; nenhuma alteração aplicada.')
          s = s.replace(marker, nav, 1)

          # 2) Satisfação só no módulo correspondente.
          old_sat = 'sat_est_str, sat_pais_str, sat_eq_str = calcular_satisfacao_global_cached(ano_f, tf)'
          new_sat = '''if aba_atual == "💬 Satisfação Pública":
              sat_est_str, sat_pais_str, sat_eq_str = calcular_satisfacao_global_cached(ano_f, tf)
          else:
              sat_est_str, sat_pais_str, sat_eq_str = "--", "--", "--"'''
          if s.count(old_sat) != 1:
              raise SystemExit(f'Bloco de satisfação encontrado {s.count(old_sat)} vezes; esperado 1.')
          s = s.replace(old_sat, new_sat, 1)

          # 3) Remove somente a criação das abas principais; mantém os nomes e o índice.
          old_tabs = '''abas_do_sistema = ["📝 Registro", "📊 Gestão Frequência", "🚨 Alertas", "📈 Histórico", "📑 Desempenho Acadêmico", "💬 Satisfação Pública"]
          if eh_admin: 
              abas_do_sistema.append("⚙️ Manutenção do Sistema")
          tabs = st.tabs(abas_do_sistema)
          indice_aba = 0
          '''
          new_tabs = 'indice_aba = 0\n'
          if s.count(old_tabs) != 1:
              raise SystemExit(f'Bloco original de tabs encontrado {s.count(old_tabs)} vezes; esperado 1.')
          s = s.replace(old_tabs, new_tabs, 1)

          # 4) Converte apenas os módulos principais. Subabas internas não são tocadas.
          n = s.count('with tabs[indice_aba]:')
          if n < 6:
              raise SystemExit(f'Apenas {n} módulos principais encontrados; esperado pelo menos 6.')
          s = s.replace('with tabs[indice_aba]:', 'if aba_atual == abas_do_sistema[indice_aba]:')

          p.write_text(s, encoding='utf-8')
          print(f'Otimização aplicada com segurança: {n} módulos condicionais.')
          PY

      - name: Validar sintaxe
        run: python -m py_compile APP.py

      - name: Publicar e remover workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APP.py
          git commit -m "Processa módulos do painel sob demanda"
          git rm .github/workflows/performance-lazy-safe.yml
          git commit -m "Remove workflow temporário de desempenho"
          git push
